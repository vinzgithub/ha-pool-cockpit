name: V4.2.1 Weather Corrective
on:
  pull_request:
  push:
    branches: [fix/v4.2.1-weather-alert]
permissions:
  contents: read
jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Build V4.2.1 and compare without changing tracked files
        run: |
          python tools/build_unified_pool_cockpit.py --version 4.2.1 --output "$RUNNER_TEMP/pool-cockpit.js"
          cmp "$RUNNER_TEMP/pool-cockpit.js" release/v4.2.1/pool-cockpit.js
          node --check release/v4.2.1/pool-cockpit.js
          sha256sum --check SHA256SUMS
      - name: Install browser dependencies (test only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - run: node tests/weather-v421.browser.cjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-v421-visual-checks
          path: ${{ runner.temp }}/pool-weather-v421/*.png
          if-no-files-found: ignore
