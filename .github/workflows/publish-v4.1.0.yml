name: Publish Pool Cockpit V4.1.0
on:
  push:
    branches: [release/v4.1.0]

permissions:
  contents: write

jobs:
  package-and-release:
    if: github.repository == 'vinzgithub/ha-pool-cockpit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify one final V4.1.0 ZIP
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_v41_public_release.py
          zip=release/pool-cockpit-v4.1.0.zip
          sha256sum "$zip" > "$zip.sha256"
          unzip -t "$zip"
          mkdir -p "$RUNNER_TEMP/v41-release"
          unzip -q "$zip" -d "$RUNNER_TEMP/v41-release"
          (cd "$RUNNER_TEMP/v41-release" && sha256sum -c SHA256SUMS)
          sha256sum -c "$zip.sha256"
      - name: Publish only v4.1.0 in public repo (no main merge)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/v4.1.0"
          if gh release view v4.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v4.1.0 release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v4.1.0 \
            "release/pool-cockpit-v4.1.0.zip" \
            "release/pool-cockpit-v4.1.0.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pool Cockpit V4.1.0 — Réel / Démonstration" \
            --notes-file "docs/releases/V4.1.0.md" \
            --latest
          gh release view v4.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets
