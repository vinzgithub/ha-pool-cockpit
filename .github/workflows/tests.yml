name: tests
on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install pytest
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - run: python -m pytest
