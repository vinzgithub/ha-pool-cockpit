name: Publish Pool Cockpit V4.3.1 installer fix
on:
  push:
    branches: [main]
    paths:
      - docs/releases/V4.3.1.md
      - .github/workflows/publish-v4.3.1.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'vinzgithub/ha-pool-cockpit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test installer and verify complete distribution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pytest
          npm ci
          npm test
          npm run test:smoke
          python3 -m pytest -q
          node --check release/v4.3.0/pool-cockpit.js
          sha256sum --check SHA256SUMS
          test -f install_v430.py
          test -f home_assistant/custom_components/ha_pool_dashboard/wintering_runtime.py
          test -f docs/releases/V4.3.1.md
          (cd release/v4.3.0 && sha256sum pool-cockpit.js > pool-cockpit.js.sha256)
          (cd release/v4.3.0 && sha256sum --check pool-cockpit.js.sha256)
      - name: Publish tagged maintenance release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v4.3.1 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v4.3.1 \
            release/v4.3.0/pool-cockpit.js \
            release/v4.3.0/pool-cockpit.js.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pool Cockpit V4.3.1 — Correctif de l'installateur" \
            --notes-file docs/releases/V4.3.1.md \
            --latest
